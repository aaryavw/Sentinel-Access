name: SentinelAccess CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Unit Tests
        env:
          PYTHONPATH: src
        run: |
          python -m unittest discover -s tests -v

  security-and-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install security linters
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Run Bandit Security Scan
        run: |
          bandit -r src/ -ll --skip B101

  docker-build:
    runs-on: ubuntu-latest
    needs: [test, security-and-lint]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: sentinel-access:latest
          load: true

      - name: Test Docker Container Health
        run: |
          docker run -d -p 8000:8000 --name sentinel-test sentinel-access:latest serve --db /tmp/sentinel.db --tokens /tmp/tokens.json
          sleep 3
          curl -f http://localhost:8000/health || exit 1
          docker stop sentinel-test
