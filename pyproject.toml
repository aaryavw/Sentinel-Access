[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-access"
version = "1.0.0"
description = "Identity and access risk analytics pipeline with a role-protected API (synthetic data)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
